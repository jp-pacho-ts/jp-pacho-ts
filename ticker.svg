<svg xmlns="http://www.w3.org/2000/svg" width="900" height="36" viewBox="0 0 900 36" role="img" aria-label="Full-stack engineer, UI/UX designer, Tacloban Philippines" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { font: 700 12px 'Montserrat','Segoe UI',Arial,'Noto Sans JP','Hiragino Sans',sans-serif; fill: #ffffff; }
    .track { animation: scroll 30s linear infinite; }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-1200px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .track { animation: none; }
    }
  </style>
  <rect width="900" height="36" fill="#000000"/>
  <rect width="900" height="1" fill="#2a2a2a"/>
  <rect y="35" width="900" height="1" fill="#2a2a2a"/>
  <g class="track">
    <text class="t" x="0" y="23" textLength="1200" lengthAdjust="spacing">FULL-STACK ENGINEER / UI/UX DESIGNER / NEXT.JS / TYPESCRIPT / POSTGRESQL / TACLOBAN, PH / 制作 / コードとデザイン / </text>
    <text class="t" x="1200" y="23" textLength="1200" lengthAdjust="spacing">FULL-STACK ENGINEER / UI/UX DESIGNER / NEXT.JS / TYPESCRIPT / POSTGRESQL / TACLOBAN, PH / 制作 / コードとデザイン / </text>
  </g>
</svg>
